[package]
name = "monochrome-devourer"
version = "0.1.0"
description = "A Windows monochrome pixel desktop creature"
authors = ["Monochrome Devourer contributors"]
edition = "2021"

[lib]
name = "monochrome_devourer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
serde_json = "1"
